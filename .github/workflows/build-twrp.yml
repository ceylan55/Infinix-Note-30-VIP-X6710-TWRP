name: Build TWRP for Infinix Note 30 VIP (X6710)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: '/mnt/twrp'

      - name: Set Up Safe Swap Space (4 GB)
        run: |
          df -h
          sudo fallocate -l 4G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: Sync Minimal Manifest TWRP-12.1
        run: |
          sudo mkdir -p /mnt/twrp
          sudo chown -R $USER:$USER /mnt/twrp
          cd /mnt/twrp
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo && chmod +x ~/repo
          ~/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy Device Tree & Build vendor_boot.img
        run: |
          mkdir -p /mnt/twrp/device/infinix/X6710
          cp -r device_tree/* /mnt/twrp/device/infinix/X6710/
          cd /mnt/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_X6710-eng
          mka vendorbootimage

      - name: Upload Fixed vendor_boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x6710twrp_fixed-vendor_boot
          path: /mnt/twrp/out/target/product/X6710/vendor_boot.img
